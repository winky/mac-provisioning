name: CI
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    # Pinned rather than macos-latest, which is bumped without notice: a break should be
    # attributable to the change that caused it. Pinned to the major version this
    # repository actually targets -- an older image would hide the kind of breakage it
    # was just repaired for (a renamed spctl flag, defaults current macOS ignores).
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5
      - name: Install ansible
        run: brew install ansible ansible-lint
      - name: ansible-lint
        run: make lint

  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5
      - name: Install ansible
        run: brew install ansible
      - name: Run ansible-playbook
        run: ansible-playbook ansible/site.yml -i ansible/inventories/macOS/local.yml --skip-tags skip_test
      - name: Run ansible-playbook again and assert idempotence
        run: |
          ansible-playbook ansible/site.yml -i ansible/inventories/macOS/local.yml --skip-tags skip_test \
            | tee /tmp/idempotence.log
          grep -q 'changed=0.*failed=0' /tmp/idempotence.log \
            || { echo "playbook is not idempotent"; exit 1; }
