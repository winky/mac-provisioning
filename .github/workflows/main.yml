name: CI
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    # Pinned: macos-latest is bumped without notice.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
      - name: Install ansible
        run: brew install ansible ansible-lint
      - name: ansible-lint
        run: make lint

  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
      - name: Install ansible
        run: brew install ansible
      - name: Run ansible-playbook
        run: ansible-playbook ansible/site.yml -i ansible/inventories/macOS/local.yml --skip-tags skip_test
      - name: Run ansible-playbook again and assert idempotence
        run: |
          ansible-playbook ansible/site.yml -i ansible/inventories/macOS/local.yml --skip-tags skip_test \
            | tee /tmp/idempotence.log
          grep -q 'changed=0.*failed=0' /tmp/idempotence.log \
            || { echo "playbook is not idempotent"; exit 1; }
