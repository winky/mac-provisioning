name: CI
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    # Pinned rather than macos-latest, which is bumped without notice: a break should be
    # attributable to the change that caused it. Pinned to the major version this
    # repository actually targets -- an older image would hide the kind of breakage it
    # was just repaired for (a renamed spctl flag, defaults current macOS ignores).
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5
      - name: Install ansible
        run: brew install ansible ansible-lint
      - name: ansible-lint
        run: make lint

  test:
    runs-on: macos-26

    # Both profiles, because a role gated by an enable_* switch never runs under the
    # laptop profile -- the Mac mini would otherwise be the first machine ever to execute
    # the unattended, agent-user and ollama roles. A runner is disposable, so pmset and
    # dscl changes cost nothing there. This replaces the macOS VM verification that was
    # dropped from Phase 1.5.
    strategy:
      fail-fast: false
      matrix:
        profile: [laptop, mac-mini]

    steps:
      - uses: actions/checkout@v5
      # asdf too: the Brewfile is not applied here, and without it asdf_runtimes would only
      # report that asdf is missing -- the install path would never run anywhere but a real Mac.
      - name: Install ansible
        run: brew install ansible asdf
      # The profile is passed explicitly: the runner is neither a MacBook nor a Mac mini,
      # so scripts/host-profile.sh would (correctly) refuse to guess.
      - name: Run ansible-playbook
        run: |
          ansible-playbook ansible/site.yml -i ansible/inventories/macOS/local.yml \
            --skip-tags skip_test -e host_profile=${{ matrix.profile }}
      - name: Run ansible-playbook again and assert idempotence
        run: |
          ansible-playbook ansible/site.yml -i ansible/inventories/macOS/local.yml \
            --skip-tags skip_test -e host_profile=${{ matrix.profile }} \
            | tee /tmp/idempotence.log
          grep -q 'changed=0.*failed=0' /tmp/idempotence.log \
            || { echo "playbook is not idempotent"; exit 1; }
