---
- name: MacOS Provisioning
  hosts: local
  become: false

  pre_tasks:
    # host_profile normally arrives as an extra var from `make deploy`, which asks
    # scripts/host-profile.sh. Resolve it the same way here so that a bare
    # `ansible-playbook site.yml` behaves identically, and so the rule lives in exactly
    # one place. It cannot be done with a fact: ansible_product_name is the model
    # *identifier*, which no longer carries the product name -- a current Mac mini
    # reports "Mac16,10", not "Macmini9,1". The script reads the marketing name instead.
    - name: Resolve the host profile
      ansible.builtin.command: "{{ provision_root }}/scripts/host-profile.sh"
      # Read-only, and it has to run in check mode too: command is not check-mode
      # capable, so without this the task is skipped by --check, host_profile never
      # gets set, and loading the profile file fails.
      check_mode: false
      register: host_profile_cmd
      changed_when: false
      when: host_profile is not defined
      tags: always

    - name: Set the host profile
      ansible.builtin.set_fact:
        host_profile: "{{ host_profile_cmd.stdout | trim }}"
      when: host_profile is not defined
      tags: always

    # include_vars fails on a missing file, so an unrecognised profile stops the run
    # rather than quietly taking the group defaults. Tagged always because the variables
    # are needed even for a single-role run such as `--tags macos`.
    - name: "Load the profile variables: {{ host_profile }}"
      ansible.builtin.include_vars: "vars/{{ host_profile }}.yml"
      tags: always

  roles:
    - role: github_known_hosts
      tags:
        - github_known_hosts
    - role: dotfiles
      tags:
        - dotfiles
    # Gated with unattended: the machine that is meant to run without anyone at it is the
    # one that has to be reachable. A laptop reporting this would be noise.
    - role: remote_login
      when: enable_unattended
      tags:
        - remote_login
    - role: tailscale
      tags:
        - tailscale
    # Gated rather than made harmless on the laptop: the settings it checks only make sense
    # on a machine that is meant to come back by itself, and a laptop reporting that its
    # FileVault is on would be noise.
    - role: unattended
      when: enable_unattended
      tags:
        - unattended
    - role: ollama
      when: enable_ollama
      tags:
        - ollama
    - role: scheduled_jobs
      when: enable_scheduled_jobs
      tags:
        - scheduled_jobs
    - role: macos
      tags:
        - macos
    # Before claude_config: its MCP servers are launched with npx, which comes from here.
    - role: asdf_runtimes
      tags:
        - asdf_runtimes
    - role: claude_config
      tags:
        - claude_config
    # After claude_config, not before. claude_config links ~/.claude/skills, and Claude
    # Code creates that path as a real directory for the skills it syncs from claude.ai --
    # `ln -sfn` cannot replace a real directory. Installing Claude Code last means that on
    # a first run the links are already there before the binary exists, so there is no
    # window in which it could be started too early.
    - role: claude_code
      tags:
        - claude_code

  # The roles report at the point they detect something, which is where the reason belongs --
  # and where it is buried, because a full run is ten roles and dozens of tasks. Each role
  # also appends the command itself to provision_actions, and this prints them together at the
  # end, immediately above the PLAY RECAP that everyone reads.
  #
  # Both are kept on purpose: the report in place says why, this list says what to type.
  post_tasks:
    - name: What still needs a person
      ansible.builtin.debug:
        msg: "{{ provision_actions | default(['Nothing: everything this playbook can do is done.']) }}"
      tags: always
