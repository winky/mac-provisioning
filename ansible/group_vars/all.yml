---
#
# group_vars/all.yml
# Play-level variables shared by both profiles.
#

# ghq owns the local clones. Each role falls back to the same default so it still works
# when run without this file, but the value belongs here: dotfiles and claude_config have
# to agree on one root, so it is not a per-role choice.
ghq_root: "{{ ansible_facts.env.HOME }}/src"

# Where this repository is checked out. Used to reach scripts/ from the playbook.
#
# realpath rather than a bare `playbook_dir ~ '/..'`: the path is not only executed but also
# written into a launchd plist, where ".../ansible/../scripts/..." is legible to a machine and
# annoying to a person reading it.
provision_root: "{{ (playbook_dir ~ '/..') | ansible.builtin.realpath }}"

# The enable_* role switches are deliberately NOT defaulted here. include_vars outranks
# group_vars, so a default would never be read while both profile files define every
# switch -- and on the day one of them omits a switch, the default would quietly turn the
# role off on that machine instead of failing. Defining them only in vars/<profile>.yml
# turns an omission into an undefined-variable error, the same way include_vars failing on
# a missing file turns a bad host_profile into an error.
