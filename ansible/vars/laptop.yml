---
#
# vars/laptop.yml
# The development and verification machine.
#
# Every switch is off: the unattended-operation and agent-hosting roles belong to the Mac
# mini. The laptop has no machine-specific packages of its own right now.
#
# The switches are defined here rather than defaulted in group_vars/all.yml so that
# leaving one out is an undefined-variable error rather than a silently disabled role.
# Both profile files therefore have to list every switch.
#
enable_unattended: false
enable_ollama: false
enable_scheduled_jobs: false

# Tailscale comes from the GUI app here (cask "tailscale-app"). The app build ships its
# CLI inside the bundle; there is no /opt/homebrew/bin/tailscale on this profile.
tailscale_bin: /Applications/Tailscale.app/Contents/MacOS/Tailscale
tailscale_package: cask "tailscale-app"
tailscale_start_hint: open -a Tailscale (the first launch asks to allow its network extension)
# The app build logs in from its menu bar item; the bundled CLI also works. The cask
# installs the standalone (macsys) build, whose CLI is not restricted like the App Store one.
tailscale_login_hint: "Log in from the Tailscale menu bar item, or run `{{ tailscale_bin }} up`."
