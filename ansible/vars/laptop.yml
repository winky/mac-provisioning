---
#
# vars/laptop.yml
# The development and verification machine.
#
# Every switch stays at the group_vars default: the headless and agent-hosting roles are
# for the Mac mini. The laptop's only machine-specific packages live in Brewfile.laptop.
#
# The values are restated rather than left to the defaults so that both profiles resolve
# to a real file. include_vars fails on a missing file, which is what turns a typo in
# host_profile into an error instead of a silent fallback.
#
enable_headless: false
enable_agent_user: false
enable_ollama: false
enable_launchd_jobs: false
