---
#
# vars/mac-mini.yml
# Always on and recovers unattended, hosts the agents -- and used interactively with a
# display too, which is why the switch is enable_unattended rather than enable_headless:
# it gates power management and auto-login, not the absence of a screen.
#
# Every switch is listed, including any that end up false: see vars/laptop.yml for why
# they are not defaulted in group_vars/all.yml.
#
enable_unattended: true
enable_ollama: true
enable_scheduled_jobs: true

# Tailscale comes from the formula here (brew "tailscale"), so the CLI is on PATH and
# tailscaled is a root LaunchDaemon started through brew services.
tailscale_bin: /opt/homebrew/bin/tailscale
tailscale_package: brew "tailscale"
tailscale_start_hint: sudo brew services start tailscale
# No menu bar on a machine that recovers unattended, so the CLI is the only way in.
tailscale_login_hint: "Run `{{ tailscale_bin }} up` and approve the URL it prints."

# Where ollama keeps its models. The one value that moves when the external NVMe arrives --
# change it here and nothing else. Only defined for this profile: the ollama role is gated on
# enable_ollama, so the laptop never reads it.
ollama_models_path: "{{ ansible_facts.env.HOME }}/.ollama/models"

# Credentials the scheduled jobs read, copied out of 1Password into the login keychain by the
# keychain role. `service` is the keychain service name the job looks up -- that name is the
# interface between this repository and winky/scheduled-jobs. `reference` is an op:// path.
#
# Empty until the 1Password references are filled in. They are not guessed: a wrong reference
# either fails or, worse, writes the contents of one credential under another's name. Nothing
# secret goes here -- an op:// path is a pointer, and the keychain service name is already
# public in the job that reads it.
#
# The one known entry is the Slack webhook that refresh-repositories posts its summary to:
#
#   keychain_items:
#     - service: scheduled-jobs-slack-webhook
#       reference: op://<vault>/<item>/<field>
keychain_items: []
