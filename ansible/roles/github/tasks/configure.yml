---
#
# github/tasks/configure.yml
# configure task of github
#
- name: Check SSH key exists
  ansible.builtin.stat:
    path: "{{ github_ssh_key_path }}/{{ github_ssh_key_name }}"
  register: github_ssh_key

- name: Create SSH key and register it to GitHub
  when: not github_ssh_key.stat.exists
  tags: [ssh_key, skip_test]
  block:
    - name: Ensure SSH directory exists
      ansible.builtin.file:
        path: "{{ github_ssh_key_path }}"
        state: directory
        mode: "0700"

    - name: Create SSH key for user
      ansible.builtin.command:
        cmd: >-
          ssh-keygen {{ github_ssh_key_options }}
          -f {{ github_ssh_key_path }}/{{ github_ssh_key_name }}
          -N '' -C {{ ansible_facts.hostname }}
        creates: "{{ github_ssh_key_path }}/{{ github_ssh_key_name }}"

    # Registered through gh rather than a Personal Access Token of our own: gh is in
    # the Brewfile and gets authenticated on every machine anyway, so a second
    # credential would only be one more thing to store and rotate.
    # Attempt it and report, rather than parsing `gh auth status` for the
    # admin:public_key scope -- which stream that output lands on varies by version.
    - name: Register the public key with GitHub
      ansible.builtin.command:
        cmd: >-
          gh ssh-key add {{ github_ssh_key_path }}/{{ github_ssh_key_name }}.pub
          --title {{ ansible_facts.hostname }}
      register: github_ssh_key_add
      changed_when: github_ssh_key_add.rc == 0
      failed_when: false

    - name: Notify that the public key must be registered manually
      ansible.builtin.debug:
        msg: >-
          Could not register the key with gh:
          {{ github_ssh_key_add.stderr | default('') | trim }}
          Grant the scope once with `gh auth refresh -s admin:public_key` and re-run,
          or add {{ github_ssh_key_path }}/{{ github_ssh_key_name }}.pub in the GitHub UI.
      when: github_ssh_key_add.rc != 0
