---
#
# github/tasks/configure.yml
# configure task of github
#
- name: Check SSH key exists
  ansible.builtin.stat:
    path: "{{ github_ssh_key_path }}/{{ github_ssh_key_name }}"
  register: github_ssh_key

- name: Create SSH key and register it to GitHub
  when: not github_ssh_key.stat.exists
  tags: [ssh_key, skip_test]
  block:
    - name: Ensure SSH directory exists
      ansible.builtin.file:
        path: "{{ github_ssh_key_path }}"
        state: directory
        mode: "0700"

    - name: Create SSH key for user
      ansible.builtin.command:
        cmd: >-
          ssh-keygen {{ github_ssh_key_options }}
          -f {{ github_ssh_key_path }}/{{ github_ssh_key_name }}
          -N '' -C {{ ansible_facts.hostname }}
        creates: "{{ github_ssh_key_path }}/{{ github_ssh_key_name }}"

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ github_ssh_key_path }}/{{ github_ssh_key_name }}.pub"
      register: github_ssh_pub_key

    - name: Add public key to GitHub
      community.general.github_key:
        name: "{{ ansible_facts.hostname }}"
        token: "{{ github_access_token }}"
        pubkey: "{{ github_ssh_pub_key.content | b64decode | trim }}"
      when: github_access_token | length > 0

    - name: Notify that the public key must be registered manually
      ansible.builtin.debug:
        msg: >-
          github_access_token is not set, so registering the key with GitHub was skipped.
          Please register {{ github_ssh_key_path }}/{{ github_ssh_key_name }}.pub manually.
      when: github_access_token | length == 0
