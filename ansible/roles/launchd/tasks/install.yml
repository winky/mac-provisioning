---
#
# launchd/tasks/install.yml
# Place the scheduled jobs and make sure launchd has them loaded
#
# A converging role: LaunchAgents live under $HOME and loading one needs no root, so this
# does the work rather than printing commands. Nothing here would make `make deploy` ask for
# a password.
#
# With launchd_jobs empty -- which it is until Phase 4 defines job A and job B -- every loop
# runs zero times and the role is a no-op. The mechanism is still exercised by passing a job
# definition with -e, which is how it was verified.
- name: Ensure the LaunchAgents directory exists
  ansible.builtin.file:
    path: "{{ launchd_agents_dir }}"
    state: directory
    mode: "0755"

# launchd does not create the directory for StandardOutPath, and a job whose log cannot be
# opened fails without saying why.
- name: Ensure the log directory exists
  ansible.builtin.file:
    path: "{{ launchd_log_dir }}"
    state: directory
    mode: "0755"

- name: Place the job definitions
  ansible.builtin.template:
    src: job.plist.j2
    dest: "{{ launchd_agents_dir }}/{{ launchd_label_prefix }}.{{ item.name }}.plist"
    mode: "0644"
  loop: "{{ launchd_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  register: launchd_placed

# launchd keeps its own copy of a job's definition, so editing the plist changes nothing
# until the job is booted out and back in. Only the ones that changed, so that a deploy does
# not disturb jobs it had nothing to say about.
- name: Unload the jobs whose definition changed
  ansible.builtin.command:
    cmd: launchctl bootout {{ launchd_domain }}/{{ launchd_label_prefix }}.{{ item.item.name }}
  loop: "{{ launchd_placed.results | default([]) | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  # Not being loaded is the normal case the first time, and bootout says so with a non-zero
  # exit. There is nothing to distinguish it from a real failure and nothing to do about
  # either, since the load below is what has to succeed.
  failed_when: false
  changed_when: true

- name: Check which jobs launchd already has
  ansible.builtin.command:
    cmd: launchctl print {{ launchd_domain }}/{{ launchd_label_prefix }}.{{ item.name }}
  loop: "{{ launchd_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  register: launchd_loaded
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the jobs launchd does not have
  ansible.builtin.command:
    cmd: >-
      launchctl bootstrap {{ launchd_domain }}
      {{ launchd_agents_dir }}/{{ launchd_label_prefix }}.{{ item.item.name }}.plist
  loop: "{{ launchd_loaded.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true

- name: Report the scheduled jobs
  ansible.builtin.debug:
    msg: >-
      {{ launchd_jobs | length }} job(s) scheduled in {{ launchd_domain }}:
      {% for job in launchd_jobs %}{{ launchd_label_prefix }}.{{ job.name }}
      at {{ '%02d:%02d' | format(job.hour, job.minute) }}{{ ', ' if not loop.last }}{% endfor %}.
      Logs go to {{ launchd_log_dir }}.
  when: launchd_jobs | length > 0
