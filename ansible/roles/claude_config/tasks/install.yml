---
#
# claude_config/tasks/install.yml
# Place the global Claude Code configuration
#
# claude-config is a private repository, so this role can only do its work once
# `gh auth login --git-protocol ssh` has registered an SSH key. Probe first and report
# what to run rather than failing the play: the next `make deploy` completes it.
#
# The git module has no equivalent: it clones, and this only needs to know whether the
# remote can be reached at all.
- name: Check whether the claude-config repository is reachable # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git ls-remote --exit-code {{ claude_config_repo }} HEAD
  register: claude_config_remote
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [skip_test]

- name: Place claude-config
  when: claude_config_remote.rc | default(1) == 0
  tags: [skip_test]
  block:
    - name: Get claude-config
      ansible.builtin.git:
        repo: "{{ claude_config_repo }}"
        version: HEAD # noqa: latest
        dest: "{{ claude_config_path }}"
        update: false

    # The repository's make install links into $(HOME)/.claude without creating it.
    - name: Ensure the Claude Code directory exists
      ansible.builtin.file:
        path: "{{ claude_config_home }}"
        state: directory
        mode: "0755"

    - name: Check where the Claude Code config links point
      ansible.builtin.stat:
        path: "{{ claude_config_home }}/{{ item }}"
      register: claude_config_link_targets
      loop: "{{ claude_config_links }}"

    # `ln -sfn` cannot replace a real directory, and Claude Code creates
    # ~/.claude/skills for the skills it syncs from claude.ai. Report it instead of
    # letting make fail.
    - name: Notify that a path has to be moved aside first
      ansible.builtin.debug:
        msg: >-
          {{ claude_config_home }}/{{ item.item }} exists but is not a symlink, so it
          cannot be replaced. Move it aside
          (mv {{ claude_config_home }}/{{ item.item }} {{ claude_config_home }}/{{ item.item }}.bak)
          and re-run.
      loop: "{{ claude_config_link_targets.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists
        - not item.stat.islnk

    # make install resolves the repository from the working directory, not from the
    # Makefile's own location, so chdir is required rather than `make -C`.
    - name: Link claude-config into the Claude Code directory
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ claude_config_path }}"
      changed_when: true
      when:
        - claude_config_link_targets.results
          | selectattr('stat.exists')
          | rejectattr('stat.islnk')
          | list | length == 0
        - claude_config_link_targets.results
          | map(attribute='stat.lnk_source', default='')
          | reject('match', claude_config_path ~ '/')
          | list | length > 0

- name: Notify that claude-config could not be reached
  ansible.builtin.debug:
    msg: >-
      {{ claude_config_repo }} is private and could not be reached.
      Run `gh auth login --git-protocol ssh` to register an SSH key,
      then re-run `make deploy`.
  when: claude_config_remote.rc | default(1) != 0
  tags: [skip_test]
