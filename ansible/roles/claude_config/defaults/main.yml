---
# Resolved the same way scripts/install.sh resolves it, so both agree on a machine
# where ~/.config/git (and with it ghq.root) has not been linked yet. A play-level
# `ghq_root` overrides it (Phase 2 sets one per host).
claude_config_ghq_root: "{{ ghq_root | default(ansible_facts.env.HOME ~ '/src') }}"

# SSH rather than HTTPS: `gh auth login --git-protocol ssh` registers a key as part of
# the one interactive step this repository already needs, so it does not depend on the
# gh credential helper being in place.
claude_config_repo: git@github.com:winky/claude-config.git
claude_config_path: "{{ claude_config_ghq_root }}/github.com/winky/claude-config"

claude_config_home: "{{ ansible_facts.env.HOME }}/.claude"
# What the repository's make install links into ~/.claude. Listed here to decide
# whether the target needs running, not to create the links.
claude_config_links:
  - settings.json
  - CLAUDE.md
  - skills
  - statusline-command.sh
