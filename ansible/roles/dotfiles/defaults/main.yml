---
# ghq owns the local clones, so the dotfiles live under its root rather than in
# ~/.dotfiles. Falls back to the same default scripts/install.sh uses; a play-level
# `ghq_root` overrides it (Phase 2 sets one per host).
dotfiles_ghq_root: "{{ ghq_root | default(ansible_facts.env.HOME ~ '/src') }}"
dotfiles_path: "{{ dotfiles_ghq_root }}/github.com/winky/dotfiles"
dotfiles_repo: https://github.com/winky/dotfiles.git
# Paths under ~/.config that `make homeConfig` links, relative to it.
dotfiles_xdg_configs:
  - git
  - nvim
  - karabiner/karabiner.json
