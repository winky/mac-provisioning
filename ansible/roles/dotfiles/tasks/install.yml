---
#
# dotfiles/tasks/install.yml
# Install dotfiles task
#
- name: Check dotfiles exists
  ansible.builtin.stat:
    path: "{{ dotfiles_path }}"
  register: dotfiles_dir

- name: Install dotfiles
  when: not dotfiles_dir.stat.exists
  tags: [skip_test]
  block:
    - name: Get dotfiles
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        version: HEAD # noqa: latest
        dest: "{{ dotfiles_path }}"

    - name: Install dotfiles
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ dotfiles_path }}"
      register: dotfiles_install
      # Only runs when the dotfiles are absent, so running it always means a change.
      changed_when: true
