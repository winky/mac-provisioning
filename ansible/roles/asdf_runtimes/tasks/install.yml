---
#
# asdf_runtimes/tasks/install.yml
# Install asdf and the runtimes the dotfiles pin, by calling their make target
#
# The dotfiles own both lists -- asdf_version in their Makefile, the runtimes in
# .tool-versions -- and the steps (`make runtimes`, which runs `make tools` first), so a
# machine that is not a Mac gets the same asdf and runtimes from the same place. This role
# only reads the lists to decide whether the target needs running: the same split as the
# dotfiles and claude_config roles.
#
# Converges rather than reports: everything lands under ~/.local/bin and ~/.asdf, so
# `make deploy` stays runnable without a password.

# Absent in CI, which does not clone the dotfiles, and on a first run where the clone failed.
# The dotfiles role reports that case; there is nothing to add here.
- name: Check whether the dotfiles pin any runtimes
  ansible.builtin.stat:
    path: "{{ asdf_runtimes_dotfiles_path }}/.tool-versions"
  register: asdf_runtimes_tool_versions

- name: Install asdf and the pinned runtimes
  when: asdf_runtimes_tool_versions.stat.exists
  block:
    - name: Read the pinned asdf version
      ansible.builtin.slurp:
        src: "{{ asdf_runtimes_dotfiles_path }}/Makefile"
      register: asdf_runtimes_makefile

    - name: Read the pinned runtimes
      ansible.builtin.slurp:
        src: "{{ asdf_runtimes_dotfiles_path }}/.tool-versions"
      register: asdf_runtimes_tool_versions_file

    # "<name> <version>" per line; comments and blank lines are skipped, as asdf skips them.
    # An empty asdf version means dotfiles older than `make tools`: the version is then not
    # compared, rather than failing the play.
    - name: Note what the dotfiles pin
      ansible.builtin.set_fact:
        asdf_runtimes_asdf_version: >-
          {{ asdf_runtimes_makefile.content | b64decode
             | regex_search('^asdf_version\s*:=\s*(\S+)', '\1', multiline=True)
             | default([''], true) | first }}
        asdf_runtimes_pinned: >-
          {{ (asdf_runtimes_tool_versions_file.content | b64decode).splitlines()
             | reject('match', '^\s*(#|$)') | map('split') | list }}

    # Read-only, so it runs in check mode too. rc is not checked: a missing binary is one of
    # the answers.
    - name: Read the installed asdf version
      ansible.builtin.command:
        cmd: "{{ asdf_runtimes_binary }} --version"
      register: asdf_runtimes_installed_version
      changed_when: false
      failed_when: false
      check_mode: false

    # The installs directory is what asdf itself checks, and it implies the plugin.
    - name: Check which pinned versions are installed
      ansible.builtin.stat:
        path: "{{ asdf_runtimes_data_dir }}/installs/{{ item[0] }}/{{ item[1] }}"
      register: asdf_runtimes_installs
      loop: "{{ asdf_runtimes_pinned }}"
      loop_control:
        label: "{{ item[0] }} {{ item[1] }}"

    # ASDF and BINDIR are passed because make does not run under a login shell here, so
    # neither HOME-relative default can be trusted to match what this role checked. Not run
    # in check mode, which is what --check should mean.
    - name: Install asdf and the missing runtimes
      ansible.builtin.command:
        cmd: >-
          make runtimes BINDIR={{ asdf_runtimes_binary | dirname }} ASDF={{ asdf_runtimes_binary }}
        chdir: "{{ asdf_runtimes_dotfiles_path }}"
      environment:
        ASDF_DATA_DIR: "{{ asdf_runtimes_data_dir }}"
      changed_when: true
      when: >-
        asdf_runtimes_asdf_version not in asdf_runtimes_installed_version.stdout
        or asdf_runtimes_installs.results | rejectattr('stat.exists') | list | length > 0
