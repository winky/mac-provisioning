---
#
# asdf_runtimes/defaults/main.yml
#
# The dotfiles own asdf itself (`make tools`, pinned in their Makefile, into ~/.local/bin)
# and the runtimes (`make runtimes`, pinned in .tool-versions). This role only decides
# whether `make runtimes` -- which runs `make tools` first -- needs running.
asdf_runtimes_binary: "{{ ansible_facts.env.HOME }}/.local/bin/asdf"
asdf_runtimes_data_dir: "{{ ansible_facts.env.HOME }}/.asdf"

# Resolved the same way the dotfiles role resolves it, rather than borrowing that role's
# variable: role defaults leaking across roles is not something to depend on.
asdf_runtimes_dotfiles_ghq_root: "{{ ghq_root | default(ansible_facts.env.HOME ~ '/src') }}"
asdf_runtimes_dotfiles_path: "{{ asdf_runtimes_dotfiles_ghq_root }}/github.com/winky/dotfiles"
