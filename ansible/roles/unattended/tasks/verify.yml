---
#
# unattended/tasks/verify.yml
# Report what still stops this machine from staying up on its own
#
# Nothing here is applied. Every change needs root, and `make deploy` is meant to stay
# runnable without a password: the machine this role targets is the one that will run
# launchd jobs, and a deploy that stops for a sudo prompt cannot be part of them.
#
# The trade is cheap because none of these drift. pmset settings and FileVault are set once
# per machine and survive reboots, so a one-off manual step costs a single command, while
# automating it would cost a password on every deploy from then on.
#
# So this role has the same shape as tailscale and claude_config: read the state, print the
# exact command, do not fail the play.
#
# FileVault stays ON, which is a deliberate trade rather than an oversight. macOS has no way
# to unlock it without a person -- no auto-unlock, no network unlock, and MDM's authenticated
# restart has to be issued from a running system, which a machine sitting at the unlock screen
# is not. So an unexpected power cut needs someone to walk over.
#
# What that buys is worth more here than the availability it costs. The machine is used by
# hand as well as unattended, so a thief who powers it on would otherwise be straight in. And
# on Apple Silicon the pre-boot unlock *is* the login, so keeping FileVault on removes the
# auto-login step altogether: nothing has to write the account password to /etc/kcpassword,
# and the login keychain is not unlocked until a person unlocks it.
- name: Read the power settings
  # Read-only, and wanted in check mode too. `pmset -g` rather than `-g custom` because
  # this role only runs on the Mac mini, which has no battery: the live settings are the
  # AC settings, and there is only one section to read.
  #
  # Testing it on a laptop is therefore power-state dependent -- `pmset -g` follows whichever
  # source is active, so unplugging the machine changes which settings look wrong. That is an
  # artefact of the test machine, not of the target.
  ansible.builtin.command:
    cmd: pmset -g
  register: unattended_pmset
  changed_when: false
  check_mode: false

# Parsed into a dict so that the comparison below is a value comparison. Matching each
# setting with a regex inside `when` looked tidier and did not work: a bare conditional
# carrying backslashes is evaluated differently from the same expression inside {{ }}, and
# `(?m)^\s*sleep\s+0\b` silently failed to match a line it matches everywhere else. Keeping
# regexes out of conditionals avoids the whole question.
#
# Only the first two fields are kept, which drops the parenthesised note pmset appends to
# some values ("0 (sleep prevented by caffeinate, powerd)"). Settings whose name has spaces
# ("Sleep On Power Button") end up as junk keys; harmless, since nothing looks them up.
- name: Note the current power settings
  ansible.builtin.set_fact:
    unattended_pmset_current: >-
      {{ dict(unattended_pmset.stdout_lines | map('trim') | select('match', '^[a-z]')
              | map('regex_replace', '^(\S+)\s+(\S+).*$', '\1|\2')
              | map('split', '|')) }}

- name: Work out which power settings are wrong
  ansible.builtin.set_fact:
    unattended_pmset_drift: "{{ unattended_pmset_drift | default([]) + [item.key] }}"
  loop: "{{ unattended_pmset_settings | dict2items }}"
  # A setting pmset does not report at all counts as wrong, which is what puts autorestart
  # on the list everywhere it is unsupported.
  when: unattended_pmset_current[item.key] | default('') | string != item.value | string

- name: Notify that the power settings are not set for unattended operation
  ansible.builtin.debug:
    msg: >-
      {{ unattended_pmset_drift | join(', ') }} {{ 'is' if unattended_pmset_drift | length == 1 else 'are' }}
      not set for unattended operation. Run:
      sudo pmset -a{% for key in unattended_pmset_drift %} {{ key }} {{ unattended_pmset_settings[key] }}{% endfor %}
  when: unattended_pmset_drift | default([]) | length > 0

- name: Read the FileVault state
  ansible.builtin.command:
    cmd: fdesetup status
  register: unattended_filevault
  changed_when: false
  failed_when: false
  check_mode: false

# Turning it on is a choice made in the macOS setup wizard; doing it afterwards means waiting
# out a full encrypt, which is why this only reports.
- name: Notify that FileVault is off
  ansible.builtin.debug:
    msg: >-
      FileVault is off. This machine is used by hand as well as unattended, so the disk
      should be encrypted: without it, powering the machine on is enough to read everything
      on it. Turn it on in System Settings > Privacy & Security, and expect a full encrypt.
  when: not unattended_filevault.stdout is search('FileVault is On')

# Without this, even a restart for an OS update needs someone at the keyboard, which would
# make the machine much harder to keep current from a distance.
- name: Check whether an authenticated restart is supported
  ansible.builtin.command:
    cmd: fdesetup supportsauthrestart
  register: unattended_authrestart
  changed_when: false
  failed_when: false
  check_mode: false

- name: Notify that authenticated restart is unavailable
  ansible.builtin.debug:
    msg: >-
      This machine cannot do an authenticated restart, so every reboot -- planned ones
      included -- needs someone to unlock FileVault in person. Planned reboots would
      otherwise go through `sudo fdesetup authrestart`.
  when: not unattended_authrestart.stdout is search('true')

# Deliberately worded as what it is. With FileVault on, an unexpected power cut still stops
# at the unlock screen; no amount of pmset changes that, and claiming otherwise would be the
# one thing this report must not do.
- name: Report what the machine can and cannot do on its own
  ansible.builtin.debug:
    msg: >-
      Power settings are right, the disk is encrypted, and planned restarts can be driven
      remotely with `sudo fdesetup authrestart`. An unexpected power cut still stops at the
      FileVault unlock screen and needs a person: that is the trade FileVault makes here.
  when:
    - unattended_pmset_drift | default([]) | length == 0
    - unattended_filevault.stdout is search('FileVault is On')
    - unattended_authrestart.stdout is search('true')
